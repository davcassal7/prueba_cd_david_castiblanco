[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-forecasting"
version = "0.1.0"
description = "Monthly sales volume forecasting with macroeconomic and commercial variables"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
