[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-forecasting"
version = "0.2.0"
description = "Monthly volume forecasting for the principal brand"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "joblib>=1.3",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
